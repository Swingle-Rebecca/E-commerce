name: Build Android APK
on:
  push:
    branches: [main, mobile-shared-cart]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
        working-directory: mobile
      - run: npx expo install --check
        working-directory: mobile
      - run: npx expo prebuild --platform android
        working-directory: mobile
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: becca-shop-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
  publish-preview:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Swingle-Rebecca/E-commerce
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: becca-shop-apk
          path: apk
      - name: Publish approved updated APK
        run: |
          if gh release view becca-shop-v1.0.1 >/dev/null 2>&1; then
            echo 'This preview version is already published.'
            exit 0
          fi
          gh release create becca-shop-v1.0.1 apk/app-release.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title 'Becca Shop 1.0.1 Android preview' \
            --notes 'Updated Android APK: shows an Added to cart confirmation after a successful cart save. Install this version over the previous APK. Uses the same Google account and database basket as the website. Classroom preview signing; not a store release.'
